[workspace]
resolver = "3"
members = ["crates/warpscript", "crates/influxftl", "xtask"]
default-members = ["crates/warpscript", "crates/influxftl"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/ferris/influxftl"
authors = ["The influxftl Authors"]
description = "WarpLib / WarpScript for InfluxDB 3 — a Rust port of the Warp 10 analytics engine"

[workspace.dependencies]
warpscript = { path = "crates/warpscript", version = "0.1.0" }
indexmap = "2"
# Typed error enums of the libraries (`warpscript`, `xtask`) and context-carrying errors of the
# binaries (`influxftl`).
thiserror = "2"
anyhow = "1"
serde_json = "1"
getrandom = "0.4"
# Java-style regular expressions (lookaround, backreferences) for MATCH / MATCHER / REPLACE.
fancy-regex = "0.20"
# Guava `BaseEncoding.base64()` / `base64Url()` equivalents (`->B64`, `B64->`…). The default
# `simd-unsafe` feature is left out: the pure Rust code path is plenty fast for script data.
base64 = { version = "0.23", default-features = false, features = ["std"] }
# Message digests of the `DIGEST` family (BouncyCastle `*Digest` classes in Warp 10) and HMAC.
digest = "0.11"
md2 = "0.11"
md4 = "0.11"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
ripemd = "0.2"
tiger = "0.3"
whirlpool = "0.11"
gost94 = "0.11"
# Keccak-f[1600] permutation: the SHA-3 / Keccak sponges are built on it (Keccak-128 and
# Keccak-288 have no ready-made implementation).
keccak = "0.2"
# AES block cipher for the RFC 3394 key wrap of `AESWRAP` / `AESUNWRAP`.
aes = "0.9"
# `GZIP` / `UNGZIP` / `DEFLATE` / `INFLATE` (pure Rust `miniz_oxide` backend).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# The raw deflate of the wrappers (`GZIPOutputStream` of a `Vec`, which cannot fail).
miniz_oxide = { version = "0.9", default-features = false }
# Calendar computations and the IANA time zone database (Joda-Time in Warp 10) for
# `ISO8601`, `TSELEMENTS`, `ADDDAYS`…
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
# Arbitrary precision integers under the Java `BigDecimal` / `BigInteger` port (`->BD`, the
# `BD*` functions, `BIGDECIMAL` arithmetic).
num-bigint = { version = "0.4", default-features = false, features = ["std"] }
num-integer = { version = "0.1", default-features = false, features = ["std"] }
num-traits = { version = "0.2", default-features = false, features = ["std"] }
# Elliptic curves of `ECGEN`, `ECSIGN`, `ECRECOVER`… (the named curves of BouncyCastle in Warp 10):
# the field and point arithmetic only, the ECDSA of the runtime is built on it.
elliptic-curve = { version = "0.14", default-features = false, features = ["arithmetic", "sec1"] }
k256 = { version = "0.14", default-features = false, features = ["arithmetic"] }
p256 = { version = "0.14", default-features = false, features = ["arithmetic"] }
p384 = { version = "0.14", default-features = false, features = ["arithmetic"] }
p521 = { version = "0.14", default-features = false, features = ["arithmetic"] }
# RSA of `RSAGEN`, `RSAENCRYPT`, `RSASIGN`… : the modular exponentiation of the keys (constant time
# in the exponent, which is the secret) and the primality test of the generation of a key. The
# padding schemes around them are what BouncyCastle does and are built in the crate.
crypto-bigint = { version = "0.7", default-features = false, features = ["alloc"] }
crypto-primes = { version = "0.7", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
# `cast_*` lints are too noisy for a numeric port that mirrors Java semantics.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
too_many_lines = "allow"
# Product names (WarpScript, WarpLib, InfluxDB) appear in every doc comment.
doc_markdown = "allow"
# Every stack function has the `fn(&mut Stack) -> Result<()>` signature, even when it cannot fail.
unnecessary_wraps = "allow"
format_push_string = "allow"
single_match_else = "allow"
struct_excessive_bools = "allow"

# The big integers of the RSA keys are far too slow to test unoptimised.
[profile.dev.package.crypto-bigint]
opt-level = 3

[profile.dev.package.crypto-primes]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
