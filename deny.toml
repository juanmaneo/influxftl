# cargo-deny policy — run with `cargo xtask security-audit` (or `cargo deny check`).
# Reference: https://embarkstudios.github.io/cargo-deny/checks/cfg.html

[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Security advisories (RustSec database)
# ---------------------------------------------------------------------------
[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

# ---------------------------------------------------------------------------
# Licenses: only OSI licenses compatible with Apache-2.0 (our license, Warp 10's
# license and one of InfluxDB 3's two licenses).
# ---------------------------------------------------------------------------
[licenses]
version = 2
confidence-threshold = 0.9
# The allow-list is forward-looking (it covers licenses common in the Rust ecosystem that the
# InfluxDB 3 / HTTP dependencies will pull in): do not warn about entries not yet encountered.
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
]
exceptions = []

[licenses.private]
ignore = true

# ---------------------------------------------------------------------------
# Bans: duplicate versions are warnings, wildcard deps are denied.
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = [
    # OpenSSL bindings: we only allow pure-Rust TLS stacks (rustls) if TLS is ever needed.
    { crate = "openssl", reason = "use rustls" },
    { crate = "openssl-sys", reason = "use rustls" },
]
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
# Sources: crates.io only.
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
